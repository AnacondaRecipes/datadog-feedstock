{% set name = "datadog" %}
{% set version = "0.56.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 834367bebacbe3381b2290c96b31d359eb6bcc76322185be260e26dac51b0989
  patches:
    - windows_socket_fix.patch  # [win]
    - windows_af_unix_guard.patch  # [win]

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - dog = datadog.dogshell:main
    - dogwrap = datadog.dogshell.wrap:main
    - dogshell = datadog.dogshell:main
    - dogshellwrap = datadog.dogshell.wrap:main
  skip: true  # [py>27 and py<37]

requirements:
  host:
    - python
    - pip
    - hatchling >=0.15.0
  run:
    - python
    - requests >=2.6.0
    - typing  # [py<35]
    - configparser <5  # [py<30]

test:
  source_files:
    - tests
  imports:
    - datadog
    - datadog.dogshell
  requires:
    - pip
    - pytest
    - mock
    - freezegun
    - psutil
  commands:
    - pip check
    - dog --help
    - dogwrap --help

about:
  home: https://github.com/DataDog/datadogpy
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: The Datadog Python library
  description: |
    The Python integration enables you to monitor any custom metric by instrumenting a few lines of code.
  doc_url: https://docs.datadoghq.com/integrations/python/
  dev_url: https://github.com/DataDog/datadogpy

extra:
  recipe-maintainers:
    - mariusvniekerk
